[Service]
# SM-T510: Samsung's audio HAL is 32-bit only, so PulseAudio (64-bit) loads
# Android's audio.hidl_compat bridge instead (bound over audio.primary.default
# by t510-audio-hidl-compat.service). The bridge is a *system* library that
# needs libaudiohal from /system; in the vendor namespace it is not found
# ("dlopen failed: library libaudiohal.so not found").
UnsetEnvironment=HYBRIS_USE_VENDOR_NAMESPACE
